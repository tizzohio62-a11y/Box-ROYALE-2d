<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Box Royale 2D</title><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--a:#3ee8e0}
*{box-sizing:border-box;margin:0;touch-action:none;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
html,body{height:100%;background:#111;font-family:'Press Start 2P','Courier New',monospace;font-size:10px;color:#fff;overflow:hidden}
body{position:fixed;inset:0}
canvas#c{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#lobby,#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);text-align:center}

#end{background:#000b;z-index:9}
h1{font-size:clamp(22px,7vw,44px);line-height:1.3;text-shadow:4px 4px #000}
h1 b{color:var(--a)}
button,input{font:inherit;font-size:11px;color:#fff;border:3px solid #000;background:#333;padding:10px 18px;border-radius:4px}
input{text-align:center;background:#0006;width:220px}
button{cursor:pointer;touch-action:manipulation}
#play{background:#f5c211;color:#000;font-size:22px;font-weight:bold;padding:14px 44px;box-shadow:0 5px #8a6a00}
.row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.sw{width:34px;height:34px;padding:0}.sw.on{outline:3px solid #fff}
.md.on{background:var(--a);color:#000}
#hud{position:absolute;inset:0;pointer-events:none;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#hud>*{position:absolute}
#hb{left:0;bottom:calc(env(safe-area-inset-bottom) + 100px);width:130px;height:16px;border:3px solid #000;border-left:0;background:#0006}#hf{height:100%;background:#27e04a}#hn{position:absolute;left:6px;top:2px;font-size:9px;text-shadow:1px 1px #000}
#info{top:calc(env(safe-area-inset-top) + 8px);left:10px;font-size:9px;line-height:1.5;text-shadow:1px 1px #000}
#bar{bottom:calc(env(safe-area-inset-bottom) + 26px);left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
#wn{bottom:calc(env(safe-area-inset-bottom) + 92px);right:8px;font-size:8px;text-shadow:1px 1px #000;white-space:nowrap}
.sl{width:54px;height:54px;border:3px solid #000;outline:2px solid #0007;position:relative;display:flex;align-items:center;justify-content:center;pointer-events:auto}.sl canvas{width:40px;height:40px;image-rendering:pixelated}
.sl.on{border-color:#fff;outline-color:#000}
.sl i{position:absolute;left:50%;transform:translateX(-50%);bottom:-20px;font-style:normal;text-shadow:2px 2px #000}
.sl em{position:absolute;bottom:2px;font-style:normal;text-shadow:1px 1px #000;font-size:11px}.sl em.l{left:4px}.sl em.r{right:4px}
#bb,#eb,#sb{right:14px;bottom:calc(env(safe-area-inset-bottom) + 125px);pointer-events:auto;background:#3ee8e0;color:#000;width:68px;height:68px;border-radius:50%;padding:0;font-size:10px}#eb{right:92px;background:#f5d020;width:54px;height:54px}
#ban{top:58%;left:0;right:0;text-align:center;font-size:clamp(14px,4vw,26px);text-shadow:3px 3px #000,-2px -2px #000,2px -2px #000,-2px 2px #000}
#ban span{color:#f33}
#lobby{justify-content:space-between;gap:0;background:radial-gradient(ellipse at 50% 42%,#7a4be0 0,#33208a 45%,#0e0a35 100%);overflow:hidden}
#lbg{position:absolute;inset:0;background:repeating-linear-gradient(115deg,#fff0 0 70px,#ffffff10 70px 140px);animation:bg 25s linear infinite;pointer-events:none}@keyframes bg{to{background-position:280px 0}}
#top{position:relative;width:100%;display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.tab{padding:8px 9px;font-size:10px;opacity:.55;cursor:pointer;border-bottom:3px solid transparent;display:inline-block}.tab.on{opacity:1;border-color:#fff}
#vb{color:#8fd0ff;font-size:10px}
#stage{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
#stage::after{content:"";position:absolute;bottom:14%;left:50%;width:240px;height:34px;margin-left:-120px;background:radial-gradient(#ffffff90,#8ad0ff40 50%,#0000 72%);border-radius:50%}
#pv{position:relative;z-index:1;height:min(100%,360px);aspect-ratio:240/280;image-rendering:pixelated}
#nm{position:absolute;top:2%;left:50%;transform:translateX(-50%);width:200px;z-index:2;background:#0007;font-size:11px}
#party{position:absolute;left:0;top:14%;display:flex;flex-direction:column;gap:8px;z-index:2}
#party div{width:44px;height:44px;border:2px solid #fff7;background:#0005;display:flex;align-items:center;justify-content:center;font-size:9px}
#lock,#shop{position:absolute;bottom:2%;z-index:3;background:#0009;border:2px solid #fff5;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center;font-size:9px}
#bot{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0}
#play{width:min(92%,340px);font-size:20px;padding:14px 0;background:#f5e11c;color:#000;border:3px solid #000;box-shadow:0 6px #8a7a00,0 0 24px #f5e11c80;transform:skewX(-8deg)}
.hint{font-size:8px;opacity:.7;line-height:1.6;max-width:340px}
#sb{bottom:calc(env(safe-area-inset-bottom) + 200px);right:18px;background:#c8a0ff;width:60px;height:60px;font-size:8px}
#ed{left:50%;top:34%;transform:translateX(-50%);pointer-events:auto;background:#000b;border:3px solid #fff;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center}
#eg{display:grid;grid-template-columns:repeat(3,46px);gap:4px}
#eg b{height:46px;background:radial-gradient(circle at 35% 35%,#fff,#37efe6 45%,#16b5b8);border-radius:50%;border:2px solid #fff;cursor:pointer}
#eg b.o{background:#000;border-color:#555;opacity:.5}
#ed button{padding:7px 9px;font-size:9px}
#lbc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lv{display:flex;align-items:center;gap:6px}.lv b{background:#f5e11c;color:#000;padding:6px 8px;font-size:11px;transform:skewX(-8deg)}
.xp{width:70px;height:8px;background:#0006;border:2px solid #000}.xp i{display:block;height:100%;background:#5ff;width:0}
.tab{font-size:9px}
#quests{position:absolute;right:0;top:12%;width:170px;background:#0007;border:2px solid #fff5;padding:8px;display:flex;flex-direction:column;gap:8px;font-size:8px;z-index:2;text-align:left;line-height:1.4}
.qh{color:#f5e11c;font-size:9px}.qb{height:6px;background:#0008;margin-top:4px}.qb i{display:block;height:100%;background:#37efe6;width:0}
#mm{width:min(92%,340px);height:8px;background:#0006;border:2px solid #000;display:none}#mm i{display:block;height:100%;background:#f5e11c;width:0;transition:width .2s}
#stage::after{display:none}
@media(max-width:560px){#quests{display:none}.xp{width:44px}}
#pcs{right:10px;bottom:calc(env(safe-area-inset-bottom) + 205px);display:flex;gap:6px;pointer-events:auto}
.pc{width:46px;height:46px;padding:0;background:#0007;border:3px solid #000}.pc.on{border-color:#fff;background:#fff3}
.pc canvas{width:32px;height:32px;image-rendering:pixelated}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud" hidden><div id="hb"><div id="hf"></div><span id="hn"></span></div><div id="info"></div><div id="ban"></div><div id="wn"></div><div id="bar"></div><button id="bb">BUILD</button><button id="eb">EDIT</button><div id="pcs"><button class="pc" data-p="1"><canvas width="16" height="16"></canvas></button><button class="pc" data-p="2"><canvas width="16" height="16"></canvas></button><button class="pc" data-p="3"><canvas width="16" height="16"></canvas></button><button class="pc" data-p="4"><canvas width="16" height="16"></canvas></button></div></div>
<div id="lobby"><canvas id="lbc"></canvas><div id="lbg"></div>
<div id="top"><div class="lv"><b id="lvn">1</b><div class="xp"><i id="xpb"></i></div></div><div><b class="tab on" data-t="p">PLAY</b><b class="tab" data-t="l">LOCKER</b><b class="tab" data-t="s">SHOP</b></div><div id="vb">◆ 1,000</div></div>
<div id="stage"><div id="party"><div>YOU</div><div>+</div><div>+</div><div>+</div></div>
<div id="quests"><div class="qh">QUESTS</div><div><span id="q1t"></span><div class="qb"><i id="q1"></i></div></div><div><span id="q2t"></span><div class="qb"><i id="q2"></i></div></div><div><span id="q3t"></span><div class="qb"><i id="q3"></i></div></div></div>
<canvas id="pv" width="240" height="280"></canvas><input id="nm" maxlength="14" placeholder="Username" value="Player">
<div id="lock" hidden><div>SKINS</div><div class="row" id="sk"></div><button id="emote">EMOTE</button></div>
<div id="shop" hidden>ITEM SHOP<br><br>NEW ITEMS SOON</div></div>
<div id="bot"><div style="font-size:9px;opacity:.85">BATTLE ROYALE</div><div class="row"><button class="md on" data-n="19">SOLO 20</button><button class="md" data-n="9">SMALL 10</button><button class="md" data-n="29">BIG 30</button></div>
<div id="mm"><i id="mmb"></i></div><button id="play">PLAY</button><div id="st" style="min-height:14px;font-size:9px"></div>
<div class="hint">PC: WASD · mouse · Z X C V wall floor ramp cone · F build (hold = bubble) · hold E + click cells to edit · Q pickaxe<br>Mobile: left stick move · right stick aim &amp; shoot</div></div></div>
<div id="end" hidden><h1 id="et"></h1><div id="es"></div><button id="play2">BACK TO LOBBY</button></div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),c=cv.getContext('2d'),T=36,N=80,R2=Math.random,rnd=(a,b)=>a+Math.floor(R2()*(b-a+1));
let puffs=[],sh=[],ed=null,W,H,dpr,S,playing=0,col='#2f8fe8',nb=19,me,ents,walls=new Map,bul,loot,sc,R,tm,feed,ban=0,banT='',mouse={x:0,y:0,d:0,s:0},ms=null,as=null,K={};
const WP={shot:{n:'Havoc Pump Shotgun',d:12,p:6,sp:.4,r:.9,mag:5,rg:.4,col:'#8a5a2a'},ar:{n:'Assault Rifle',d:14,p:1,sp:.06,r:.13,mag:30,rg:.9,col:'#3a5a3a'},food:{n:'Sandwich',col:'#e8c070'}};
const COLS=['#2f8fe8','#e83f5f','#3fe86a','#e8c53f'],NAMES='Lacy Kmyrii Void Nova Blaze Ghost Rexy Zed Mango Pixel Turbo Vex Luna Axel Echo Drift Jinx Onyx Rush Sly Taz Wolf Yeti Zap Bolt Fang Hex Ion Kai Neo'.split(' ');
function rs(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;S=Math.max(1.2,Math.min(2.4,Math.min(W,H*.6)/300))}
addEventListener('resize',rs);rs();
// lobby
COLS.forEach((k,i)=>{const b=document.createElement('button');b.className='sw'+(i?'':' on');b.style.background=k;b.onclick=()=>{col=k;document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));b.classList.add('on')};$('sk').appendChild(b)});
document.querySelectorAll('.md').forEach(b=>b.onclick=()=>{nb=+b.dataset.n;document.querySelectorAll('.md').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
let wins=0,tk=0,mp=0;try{tk=+localStorage.getItem('brk')||0;mp=+localStorage.getItem('brm')||0;wins=+localStorage.getItem('brw')||0;$('nm').value=localStorage.getItem('brn')||'Player'}catch(e){}
const pg=$('pv').getContext('2d');let lt=0;
let emU=0;$('emote').onclick=()=>emU=performance.now()+2000;
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');$('lock').hidden=t.dataset.t!='l';$('shop').hidden=t.dataset.t!='s'});
const P=Array.from({length:45},()=>({x:R2(),y:R2(),v:.02+R2()*.05,s:3+R2()*6,a:.1+R2()*.3}));
function lobStats(){const xp=tk*50+wins*300+mp*20;$('lvn').textContent=1+Math.floor(xp/500);$('xpb').style.width=(xp%500)/5+'%';for(const[i,n,v,m]of[[1,'Win 5 matches',wins,5],[2,'Eliminate 25 players',tk,25],[3,'Play 10 matches',mp,10]]){$('q'+i).style.width=Math.min(100,v/m*100)+'%';$('q'+i+'t').textContent=n+' '+Math.min(m,v)+'/'+m}}
function lobbyLoop(t){if(playing)return;const L=$('lbc'),g=L.getContext('2d');if(L.width!=innerWidth||L.height!=innerHeight){L.width=innerWidth;L.height=innerHeight}g.clearRect(0,0,L.width,L.height);
for(const p of P){p.y-=p.v*.016;if(p.y<-.05){p.y=1.05;p.x=R2()}g.save();g.translate(p.x*L.width,p.y*L.height);g.rotate(t/1500+p.s);g.globalAlpha=p.a;g.fillStyle='#fff';g.fillRect(-p.s/2,-p.s/2,p.s,p.s);g.restore()}
pg.clearRect(0,0,240,280);pg.imageSmoothingEnabled=false;const em=t<emU,gr=pg.createRadialGradient(120,140,10,120,140,120);gr.addColorStop(0,col+'99');gr.addColorStop(1,'#0000');pg.fillStyle=gr;pg.fillRect(0,0,240,280);
const pu=.5+.5*Math.sin(t/500);pg.fillStyle='#ffffff30';pg.beginPath();pg.ellipse(120,232,92,18,0,0,6.3);pg.fill();pg.strokeStyle='rgba(140,240,255,'+(.5+pu*.4)+')';pg.lineWidth=3;pg.beginPath();pg.ellipse(120,232,92+pu*6,18+pu*2,0,0,6.3);pg.stroke();
spr(pg,120,150+(em?-Math.abs(Math.sin(t/110))*14:Math.sin(t/450)*3),em?(Math.sin(t/160)>0?.3:Math.PI-.3):.3,col,'p',em?Math.sin(t/90)*.7:0,8,em?t/70:0);lobStats();$('st').textContent=$('st').dataset.lock?$('st').textContent:'Wins '+wins+' · Kills '+tk;requestAnimationFrame(lobbyLoop)}
requestAnimationFrame(lobbyLoop);
$('play').onclick=()=>{const s=$('st');if(s.dataset.lock)return;s.dataset.lock=1;$('mm').style.display='block';let n=1;const iv=setInterval(()=>{n+=rnd(1,4);$('mmb').style.width=Math.min(100,n/(nb+1)*100)+'%';if(n>=nb+1){clearInterval(iv);s.textContent='Match found! Dropping in...';setTimeout(()=>{delete s.dataset.lock;start()},900)}else s.textContent='Finding players... '+n+'/'+(nb+1)},220)};
$('play2').onclick=()=>{$('end').hidden=1;$('lobby').hidden=0;playing=0;requestAnimationFrame(lobbyLoop)};
// sprite
function spr(g,x,y,a,k,it,sw,z,ph){g.save();g.translate(x,y);g.scale(z||1,z||1);ph=ph||0;const f=Math.cos(a)<0?-1:1,bo=Math.abs(Math.sin(ph))*1.5,l=Math.sin(ph)*2;g.fillStyle='#0003';g.fillRect(-6,8,12,3);g.fillStyle='#1d2540';g.fillRect(-4,4,3,6+l*.5);g.fillRect(1,4,3,6-l*.5);g.translate(0,-bo);
g.fillStyle=k;g.fillRect(-5,-3,10,8);g.fillStyle='#0003';g.fillRect(-5,3,10,2);g.fillStyle='#f0c8a0';g.fillRect(-4,-11,8,8);g.fillStyle='#1b1b2b';g.fillRect(-4,-12,8,4);g.fillStyle='#fff';g.fillRect(-6,-9,2,5);g.fillRect(4,-9,2,5);g.fillRect(-4,-13,8,1);g.fillStyle='#111';g.fillRect(f>0?1:-3,-7,2,2);
g.translate(0,1);g.rotate(a);if(f<0)g.scale(1,-1);g.rotate(sw||0);if(it=='g'){g.fillStyle='#222';g.fillRect(3,-1,14,3);g.fillStyle='#6b4a2a';g.fillRect(0,-1,4,3);g.fillStyle='#555';g.fillRect(8,1,5,2)}else if(it=='p'){g.fillStyle='#6b4a2a';g.fillRect(3,-1,12,2);g.fillStyle='#999';g.fillRect(13,-5,3,10);g.fillStyle='#333';g.fillRect(15,-5,1,10)}g.restore()}
// world
const key=(x,y)=>y*N+x,wl=(x,y)=>{const tx=Math.floor(x/T),ty=Math.floor(y/T),w=walls.get(key(tx,ty));if(!w||w.t==2||w.t==3)return;if(!w.m)return w;const i=Math.min(2,Math.floor((y-ty*T)/(T/3)))*3+Math.min(2,Math.floor((x-tx*T)/(T/3)));return w.m>>i&1?undefined:w},solid=(x,y)=>x<0||y<0||x>=N*T||y>=N*T||wl(x,y);
function raw(x,y){return walls.get(key(Math.floor(x/T),Math.floor(y/T)))}
function hit(x,y){const r=3;return solid(x-r,y-r)||solid(x+r,y-r)||solid(x-r,y+r)||solid(x+r,y+r)}
function mv(e,dx,dy){if(!hit(e.x+dx,e.y))e.x+=dx;if(!hit(e.x,e.y+dy))e.y+=dy}
function mk(name,k,bot,x,y){const e={name,col:k,bot,x,y,hp:200,ang:0,alive:1,kills:0,cd:0,sel:0,sw:0,rl:0,hit:0,inv:[{t:'pick'},bot?{t:R2()<.5?'shot':'ar',a:5}:null,null,null],t:0,ph:0,sc:0,bp:1};if(e.inv[1])e.inv[1].a=WP[e.inv[1].t].mag;if(!bot){e.inv[1]={t:'shot',a:5};e.inv[3]={t:'food',n:3}}e.sel=1;ents.push(e);return e}
function spawnPos(){for(;;){const x=rnd(3,N-4)*T+T/2,y=rnd(3,N-4)*T+T/2;if(!hit(x,y)&&Math.hypot(x-sc.x,y-sc.y)<R*.85&&!ents.some(e=>Math.hypot(e.x-x,e.y-y)<180))return[x,y]}}
function start(){document.querySelectorAll('.pc').forEach(b=>{ico(b.firstChild,'p'+b.dataset.p);b.onpointerdown=e=>{e.stopPropagation();if(playing)bdown(+b.dataset.p)}});mp++;try{localStorage.setItem('brm',mp)}catch(e){}$('mm').style.display='none';$('mmb').style.width=0;$('lobby').hidden=1;$('end').hidden=1;$('hud').hidden=0;playing=1;try{localStorage.setItem('brn',$('nm').value)}catch(e){}
walls.clear();puffs=[];sh=[];ed=null;ez=1;

sc={x:N*T/2+rnd(-200,200),y:N*T/2+rnd(-200,200)};R=2000;tm=0;ents=[];bul=[];loot=[];feed=[];
for(let i=0;i<120;i++){const x=rnd(3,N-4)*T+T/2,y=rnd(3,N-4)*T+T/2;if(!hit(x,y))loot.push({x,y,t:['shot','ar','food','food','ar'][rnd(0,4)]})}
const nm=($('nm').value||'Player').slice(0,14);let p=spawnPos();me=mk(nm,col,0,p[0],p[1]);
const pool=NAMES.slice().sort(()=>R2()-.5);for(let i=0;i<nb;i++){p=spawnPos();mk(pool[i%pool.length]+rnd(1,99),COLS[rnd(0,3)],1,p[0],p[1])}
$('bar').innerHTML=['Q','1','2','3','4'].map((l,i)=>`<div class="sl" data-i="${i}"><canvas width="16" height="16"></canvas><em></em><i>${l}</i></div>`).join('');
document.querySelectorAll('.sl').forEach(d=>d.onpointerdown=e=>{e.stopPropagation();me.sel=+d.dataset.i});last=performance.now();requestAnimationFrame(loop)}
// actions
function puff(x,y,n){for(let i=0;i<n;i++)puffs.push({x:x+rnd(-8,8),y:y+rnd(-8,8),r:3+R2()*4,l:.5})}
let ez=1,ec={x:0,y:0},edDown=0,eT=0,bto=0;const Z=2.6,cam={x:0,y:0,s:1};
function startEd(){for(const d of[42,28,56]){const a=me.ang,tx=Math.floor((me.x+Math.cos(a)*d)/T),ty=Math.floor((me.y+Math.sin(a)*d)/T),w=walls.get(key(tx,ty));if(w&&w.t){ed={k:key(tx,ty),tx,ty,m:w.m|0,dr:1};return}}}
function applyEd(){const w=walls.get(ed.k);if(w){w.m=ed.m;puff(ed.tx*T+T/2,ed.ty*T+T/2,4);if(w.m==511)walls.delete(ed.k)}ed=null}
function edCell(x,y,first){const wx=(x-W/2)/cam.s+cam.x,wy=(y-H/2)/cam.s+cam.y,lx=wx-ed.tx*T,ly=wy-ed.ty*T;if(lx<0||ly<0||lx>=T||ly>=T)return 0;const i=Math.floor(ly/(T/3))*3+Math.floor(lx/(T/3));if(first)ed.dr=ed.m>>i&1?0:1;if(ed.dr)ed.m|=1<<i;else ed.m&=~(1<<i);return 1}
const ek=()=>{if(!playing)return;if(ed)applyEd();else startEd()};
function bubble(e){const px=Math.floor(e.x/T),py=Math.floor(e.y/T);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const x=px+dx,y=py+dy;if(x<1||y<1||x>=N-1||y>=N-1||walls.has(key(x,y)))continue;const cx=x*T+T/2,cy=y*T+T/2;if(ents.some(o=>o!==e&&o.alive&&Math.abs(o.x-cx)<24&&Math.abs(o.y-cy)<24))continue;walls.set(key(x,y),{hp:150,mx:150,t:1,m:0});puff(cx,cy,2)}}
